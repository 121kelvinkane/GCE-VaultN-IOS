workflows:
  ios-simulator-workflow:
    name: iOS Simulator Build (No Certificates Needed)
    max_build_duration: 30
    environment:
      vars:
        XCODE_PROJECT: "GCEVault.xcodeproj"
        XCODE_SCHEME: "GCEVault"
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode Project
        script: |
          cd ios
          xcodegen generate
      - name: Build for iOS Simulator
        script: |
          cd ios
          xcodebuild clean build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            BUILD_DIR="$CM_BUILD_DIR/build"
      - name: Zip the .app bundle for Browser Testing
        script: |
          cd "$CM_BUILD_DIR/build/Debug-iphonesimulator"
          zip -r GCEVault_Simulator.app.zip GCEVault.app
          echo "✅ Simulator app bundled successfully!"
    artifacts:
      - build/Debug-iphonesimulator/GCEVault_Simulator.app.zip
    publishing:
      email:
        recipients:
          - kanekelvin97@gmail.com